<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Kenmark Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#F5F7FA;
    color:#1F2937;
}

/* HEADER */

.header{

    background:#2563EB;
    color:white;
    padding:25px 40px;

    display:flex;
    justify-content:space-between;
    align-items:center;

}
.header h1{
    font-size:30px;
}

.header p{
    opacity:.8;
    margin-top:5px;
}

/* MAIN */

.container{
    padding:35px;
}

/* KPI CARDS */

.kpis{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

    gap:25px;

    margin-bottom:40px;

}

.card{

    background:white;

    border-radius:18px;

    padding:30px;

    border-top:6px solid #2563EB;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

}

.card h2{

    font-size:38px;

    color:#2563eb;

    margin-top:10px;

}

.card p{

    color:#666;

    font-weight:bold;

}

/* TWO COLUMN SECTION */

.dashboard{

    display:grid;

    grid-template-columns:2fr 1fr;

    gap:25px;

}

/* PANELS */

.panel{

    background:white;

    border-radius:18px;

    padding:25px;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

}

.panel h3{

    margin-bottom:20px; 
     color:#1748b3;

}

/* QUICK ACTIONS */

.action{

    display:block;

    width:100%;

    padding:15px;

    margin-bottom:15px;

    border:none;

    border-radius:10px;

    background:#e69b06;

    color:white;

    font-size:15px; 
    font-weight:bold;

    cursor:pointer;

}

.action:hover{

    background:#B8860B;

}

.performance-card{

    margin-bottom:25px;

}

.performance-header{

    display:flex;

    justify-content:space-between;

    margin-bottom:8px;

    font-weight:bold;

}

.progress{

    width:100%;

    height:12px;

    background:#e5e7eb;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:8px;

}

.progress-fill{

    height:100%;

    background:#B8860B;

    border-radius:20px;

    transition:.4s;

} 

.performance-card{

    background:#ffffff;

    padding:20px;

    margin-bottom:20px;

    border-radius:15px;

    border-left:6px solid #2563EB;

    box-shadow:0 4px 12px rgba(0,0,0,.08);

}

.performance-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:12px;

    font-weight:bold;

    font-size:16px;

}

.progress{

    width:100%;

    height:10px;

    background:#e5e7eb;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:10px;

}

.progress-fill{

    height:100%;

    background:#D4A017;

    border-radius:20px;

    transition:.5s;

}

.performance-card small{

    color:#666;

    font-size:13px;

} 

.performance-card:hover{

    transform:translateY(-4px);

    transition:.25s;

    box-shadow:0 10px 25px rgba(0,0,0,.12);

}

</style>

</head>
<script> 

    async function loadDashboardStats(){

    const response =
    await fetch("http://localhost:3000/dashboard/stats");

    const stats =
    await response.json();

    document.getElementById("projectsCount").innerHTML =
    stats.total_projects;

    document.getElementById("parcelCount").innerHTML =
    stats.total_parcels;

    document.getElementById("availableCount").innerHTML =
    stats.available;

    document.getElementById("soldCount").innerHTML =
    stats.sold;

}

async function loadProjectPerformance(){

    const response =
    await fetch("http://localhost:3000/dashboard/project-performance");

    const projects =
    await response.json();

    const container =
    document.getElementById("projectPerformance");

    container.innerHTML = "";

    projects.forEach(project=>{

        const total = Number(project.total);

        const sold = Number(project.sold);

        const available = Number(project.available);

        const reserved = Number(project.reserved);

        const percent =
        total === 0 ? 0 : Math.round((sold / total) * 100);

        container.innerHTML += `

        <div class="performance-card">

            <div class="performance-header">

                <strong>${project.project_name}</strong>

                <span><strong>${sold}</strong> / ${total} Sold</span>

            </div>

            <div class="progress">

                <div
                class="progress-fill"
                style="width:${percent}%">

                </div>

            </div>

            <small>

🟢 Available: <strong>${available}</strong>

&nbsp;&nbsp;&nbsp;

🟡 Reserved: <strong>${reserved}</strong>

&nbsp;&nbsp;&nbsp;

🔴 Sold: <strong>${sold}</strong>

</small>

        </div>

        `;

    });

}

function openProject(id){

    location.href = `project.html?id=${id}`;

}
loadDashboardStats();
loadProjectPerformance();


</script>
<body>

<div class="header">

<div>

<h1>Kenmark Land System</h1>

<p>Management Dashboard</p>

</div>

<div>

Welcome Admin

</div>

</div>

<div class="container">

<!-- KPI CARDS -->

<div class="kpis">

<div class="card">

<p>Projects</p>

<h2 id="projectsCount">0</h2>

</div>

<div class="card">

<p>Total Parcels</p>

<h2 id="parcelCount">0</h2>

</div>

<div class="card">

<p>Available</p>

<h2 id="availableCount">0</h2>

</div>

<div class="card">

<p>Sold</p>

<h2 id="soldCount">0</h2>

</div>

</div>

<!-- LOWER SECTION -->

<div class="dashboard">

<div class="panel">

<h3>📈 Project Performance</h3>

<div id="projectPerformance"></div>

</div>

<div class="panel">

<h3>⚡ Quick Actions</h3>

<button
class="action"
onclick="location.href='projects.html'">

📁 View Projects

</button>

<button class="action">📦 Manage Parcels</button>

<button class="action">👥 Customers</button>

<button class="action">📅 Reservations</button>

<button class="action">🗺 Open GIS Map</button>

</div>

</div>

</div>


</body>

</html>
