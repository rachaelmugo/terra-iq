<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Projects</title>

<style>

body{
    margin:0;
    padding:30px;
    font-family:Segoe UI,Arial,sans-serif;
    background:#f4f6f9;
}

h1{
    margin-top:0;
}

#projects{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));

    gap:25px;

    margin-top:30px;

}

.card{

    background:white;

    border-radius:18px;

    overflow:hidden;

    box-shadow:0 10px 25px rgba(0,0,0,.08);

    transition:.3s;

}

.card:hover{

    transform:translateY(-8px);

    box-shadow:0 20px 35px rgba(0,0,0,.15);

}

.card h2{

    padding:0 20px;

}

.card p{

    padding:0 20px;

}

.card button{

    margin:20px;

}

button{

    margin-top:20px;

    padding:10px 18px;

    background:#2563eb;

    color:white;

    border:none;

    border-radius:8px;

    cursor:pointer;

}

button:hover{

    background:#1d4ed8;

} 

.project-image{

    width:100%;

    height:220px;

    object-fit:cover;

    border-radius:12px;

    margin-bottom:15px;

}

.progress{

    height:10px;

    background:#ddd;

    border-radius:20px;

    margin:20px;

    overflow:hidden;

}

.progress-fill{

    height:100%;

    background:#16a34a;

} 

.open-btn{

    display:inline-block;

    margin:20px;

    padding:10px 18px;

    background:#2563eb;

    color:white;

    text-decoration:none;

    border-radius:8px;

    font-weight:bold;

}

.open-btn:hover{

    background:#1d4ed8;

} 

</style>

</head>

<body>

<h1>Kenmark Projects</h1>

<div id="projects"></div>

<script>

loadProjects();

async function loadProjects(){

    const response =
    await fetch("http://localhost:3000/projects");

    const projects =
    await response.json();

    const container =
    document.getElementById("projects");

    container.innerHTML = "";

    projects.forEach(project=>{

       container.innerHTML += `

<div class="card">

<img
src="http://localhost:3000/${project.image_url}"
class="project-image">

<h2>${project.project_name}</h2>

            <p><b>Location:</b> ${project.location}</p>

            <p><b>Price From:</b>
            KSh ${Number(project.price_from).toLocaleString()}</p>

           <p><b>📦 Total Parcels:</b> ${project.parcel_count}</p>

<p style="color:green;">
🟢 Available: ${project.available}
</p>

<p style="color:#d97706;">
🟡 Reserved: ${project.reserved}
</p>

<p style="color:red;">
🔴 Sold: ${project.sold}
</p>

<div class="progress">

    <div
    class="progress-fill"
    style="width:${(project.available / project.parcel_count) * 100}%">
    </div>

</div>

<p style="text-align:center;font-weight:bold;color:#16a34a;">
${Math.round((project.available / project.parcel_count) * 100)}% Available
</p>

            <a href="project.html?id=${project.id}" class="open-btn">
    Open Project
</a>

        </div>

        `;

    });

}

</script>

</body>

</html>
