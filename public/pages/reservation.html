<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Reservations</title>

<style>

body{

font-family:Segoe UI;

background:#f5f5f5;

padding:40px;

}

table{

width:100%;

border-collapse:collapse;

background:white;

}

th{

background:#111827;

color:white;

padding:12px;

}

td{

padding:12px;

border-bottom:1px solid #eee;

}

tr:hover{

background:#f8f8f8;

}

</style>

</head>

<body>

<h2>Reservations</h2>

<table>

<thead>

<tr>

<th>Reservation</th>

<th>Customer</th>

<th>Project</th>

<th>Parcel</th>

<th>Price</th>

<th>Status</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

<script>

loadReservations();

async function loadReservations(){

const response =
await fetch("http://localhost:3000/reservations");

const reservations =
await response.json();

const table =
document.getElementById("tableBody");

table.innerHTML="";

reservations.forEach(r=>{

table.innerHTML+=`

<tr>

<td>${r.reservation_no}</td>

<td>${r.customer_name}</td>

<td>${r.project_name}</td>

<td>${r.parcel_no}</td>

<td>KSh ${Number(r.price).toLocaleString()}</td>

<td>${r.status}</td>

</tr>

`;

});

}

</script>

</body>

</html>
